services:
  mysql:
    image: mysql:latest
    container_name: mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_db

    ports:
      - "3310:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - user-network

  user-service:
    image: user-service:latest
    build: .
    container_name: user-service
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://mysql:3306/user_db
      DB_USERNAME: root
      DB_PASSWORD: root

    depends_on:
      - mysql

    networks:
      - user-network

volumes:
  mysql-data:
networks:
  user-network:
    driver: bridge